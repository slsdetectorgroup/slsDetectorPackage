name: Native CMake Build

on: [push, pull_request] 

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest
    name: Configure and build using cmake
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12
          cache: 'pip'
      - run: pip install pytest numpy colorama

      # using a stable action version instead of latest to create/restore cache for now
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.1
        with:
          packages: libhdf5-dev qtbase5-dev qt5-qmake libqt5svg5-dev libpng-dev libtiff-dev
          version: 1.0

      # verify packages restored from cache are installed.
      # This catches incomplete apt installs after cache restore.
      - name: Verify apt packages
        id: verify_packages
        run: |
          failed=""

          for pkg in \
            libhdf5-dev \
            qtbase5-dev \
            qt5-qmake \
            libqt5svg5-dev \
            libpng-dev \
            libtiff-dev \
            libfmt-dev
          do
            if ! dpkg -s "$pkg" >/dev/null 2>&1; then
              echo "Missing: $pkg"
              failed="$failed $pkg"
            fi
          done


          if [ -n "$failed" ]; then
            echo "Missing packages after cache restore: $failed. Try deleting the cache and rerunning the workflow."
            exit 1
          else
            echo "All apt packages are installed"  
          fi

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: |
          cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DSLS_USE_TESTS=ON \
          -DSLS_USE_SIMULATOR=ON \
          -DSLS_USE_PYTHON=ON \
          -DSLS_USE_HDF5=ON \
          -DSLS_USE_GUI=ON \
          -DSLS_USE_MOENCH=ON \
          -DSLS_TREAT_WARNINGS_AS_ERRORS=ON

      - name: Build
        # Build your program with the given configuration
        run: cmake --build ${{github.workspace}}/build -j4 --config ${{env.BUILD_TYPE}}




  
      



