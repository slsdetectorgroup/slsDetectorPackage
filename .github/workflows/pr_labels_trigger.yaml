# This workflow is triggered when a PR label is added or removed.
# It validates the label state and then calls the reusable PR milestone workflow.

name: PR Labels Trigger

on:
  pull_request:
    types:
      - labeled
      - unlabeled

permissions:
  pull-requests: write
  contents: read

jobs:
  detect-mismatch:
    name: Detect PR label mismatch
    runs-on: ubuntu-latest
    outputs:
      should_run_validation: ${{ steps.detect.outputs.should_run_validation }}

    steps:
      - name: Detect current PR label mismatch
        id: detect
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const body = context.payload.pull_request.body || '';

            const { data: currentLabels } =
              await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });

            const labelNames =
              currentLabels.map(label => label.name);

            const feature =
              /-\s*\[[xX]\]\s*Feature\b/.test(body);

            const bugFix =
              /-\s*\[[xX]\]\s*Bug Fix\b/.test(body);

            const infrastructure =
              /-\s*\[[xX]\]\s*Infrastructure\b/.test(body);

            const breakingApi =
              /-\s*\[[xX]\]\s*This is a Breaking API change\b/.test(body);

            const expectedPrimary =
              feature ? 'Feature' :
              bugFix ? 'Bug Fix' :
              infrastructure ? 'Infrastructure' :
              null;

            const primaryLabels = [
              'Feature',
              'Bug Fix',
              'Infrastructure'
            ];

            const selectedPrimary =
              primaryLabels.filter(label =>
                labelNames.includes(label)
              );

            const triggerValidation = (reason) => {
              core.warning(
                `${reason} Triggering PR validation to reconcile labels from the PR description.`
              );
              core.setOutput('should_run_validation', 'true');
              return;
            };

            // no labels
            if (selectedPrimary.length === 0) {
              return triggerValidation(
                'No primary PR label is present on the PR.'
              );
            }

            // no checkbox selected in description
            if (expectedPrimary === null) {
              return triggerValidation(
                'No primary PR type is selected in the PR description.'
              );
            }


            if (selectedPrimary.length !== 1 || selectedPrimary[0] !== expectedPrimary) {
              return triggerValidation(
                `PR label mismatch: description expects ${expectedPrimary}, but labels are ${selectedPrimary.join(', ') || 'none'}.`
              );
            }

            const hasBreakingApiLabel =
              labelNames.includes('Breaking API');

            if (breakingApi !== hasBreakingApiLabel) {
              return triggerValidation(
                `PR label mismatch: Breaking API checkbox is ${breakingApi ? 'checked' : 'unchecked'}, but the label state is ${hasBreakingApiLabel ? 'present' : 'absent'}.`
              );
            }

            // redundant but leaving it here for clarity
            if (infrastructure && hasBreakingApiLabel) {
              return triggerValidation(
                'Infrastructure PRs cannot have the Breaking API label.'
              );
            }

            // If we reach this point, no validation is needed
            core.setOutput('should_run_validation', 'false');

            core.info(
              `Label state matches PR description: ${expectedPrimary}`
            );
            core.info(
              `Breaking API: ${hasBreakingApiLabel ? 'present' : 'absent'}`
            );

  run-pr-validation:
    needs: detect-mismatch
    if: ${{ needs.detect-mismatch.outputs.should_run_validation == 'true' }}
    uses: ./.github/workflows/pr_validation.yaml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    permissions:
      pull-requests: write
      contents: read

  milestone:
    needs:
      - detect-mismatch
    if: ${{ needs.detect-mismatch.outputs.should_run_validation == 'false' || needs.run-pr-validation.result == 'success' }}
    uses: ./.github/workflows/pr_milestone.yaml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    permissions:
      pull-requests: write
      contents: read