# This workflow is triggered when a PR label is added or removed.
# It validates the label state and then calls the reusable PR milestone workflow.

name: PR Milestone Trigger

on:
  pull_request:
    types:
      - labeled
      - unlabeled

permissions:
  pull-requests: write
  contents: read

jobs:
  validate-labels:
    name: Validate PR labels
    runs-on: ubuntu-latest

    steps:
      - name: Validate current PR labels
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const body = context.payload.pull_request.body || '';

            const { data: currentLabels } =
              await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });

            const labelNames =
              currentLabels.map(label => label.name);

            const feature =
              /-\s*\[[xX]\]\s*Feature\b/.test(body);

            const bugFix =
              /-\s*\[[xX]\]\s*Bug Fix\b/.test(body);

            const infrastructure =
              /-\s*\[[xX]\]\s*Infrastructure\b/.test(body);

            const breakingApi =
              /-\s*\[[xX]\]\s*This is a Breaking API change\b/.test(body);

            const expectedPrimary =
              feature ? 'Feature' :
              bugFix ? 'Bug Fix' :
              infrastructure ? 'Infrastructure' :
              null;

            const primaryLabels = [
              'Feature',
              'Bug Fix',
              'Infrastructure'
            ];

            const selectedPrimary =
              primaryLabels.filter(label =>
                labelNames.includes(label)
              );

            if (expectedPrimary === null) {
              core.setFailed(
                'No primary PR type is selected in the PR description.'
              );
              return;
            }

            if (selectedPrimary.length !== 1 || selectedPrimary[0] !== expectedPrimary) {
              core.setFailed(
                `PR label mismatch: description expects ${expectedPrimary}, but labels are ${selectedPrimary.join(', ') || 'none'}.`
              );
              return;
            }

            const hasBreakingApiLabel =
              labelNames.includes('Breaking API');

            if (breakingApi !== hasBreakingApiLabel) {
              core.setFailed(
                `PR label mismatch: Breaking API checkbox is ${breakingApi ? 'checked' : 'unchecked'}, but the label state is ${hasBreakingApiLabel ? 'present' : 'absent'}.`
              );
              return;
            }

            if (infrastructure && hasBreakingApiLabel) {
              core.setFailed(
                'Infrastructure PRs cannot have the Breaking API label.'
              );
              return;
            }

            core.info(
              `Label state matches PR description: ${expectedPrimary}`
            );
            core.info(
              `Breaking API: ${hasBreakingApiLabel ? 'present' : 'absent'}`
            );

  milestone:
    needs: validate-labels
    if: ${{ success() }}
    uses: ./.github/workflows/pr_milestone.yaml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    permissions:
      pull-requests: write
      contents: read