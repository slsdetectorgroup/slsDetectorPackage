# This workflow is triggered when a PR label is added or removed.
# It validates the label state and then calls the reusable PR milestone workflow.

name: PR Milestone Trigger

on:
  pull_request:
    types:
      - labeled
      - unlabeled

permissions:
  pull-requests: write
  contents: read

jobs:
  validate-labels:
    name: Validate PR labels
    runs-on: ubuntu-latest

    steps:
      - name: Validate current PR labels
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.payload.pull_request.number;

            const { data: currentLabels } =
              await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });

            const labelNames =
              currentLabels.map(label => label.name);

            const primaryLabels = [
              'Feature',
              'Bug Fix',
              'Infrastructure'
            ];

            const selectedPrimary =
              primaryLabels.filter(label =>
                labelNames.includes(label)
              );

            if (selectedPrimary.length !== 1) {
              core.setFailed(
                'Exactly one primary PR type label must be selected: Feature, Bug Fix, Infrastructure.'
              );
              return;
            }

            const breakingApi =
              labelNames.includes('Breaking API');

            if (
              selectedPrimary.includes('Infrastructure') &&
              breakingApi
            ) {
              core.setFailed(
                'Infrastructure PRs cannot have the Breaking API label.'
              );
              return;
            }

            core.info(
              `Valid primary PR type label: ${selectedPrimary[0]}`
            );
            core.info(
              `Breaking API label present: ${breakingApi ? 'yes' : 'no'}`
            );

  milestone:
    needs: validate-labels
    if: ${{ success() }}
    uses: ./.github/workflows/pr_milestone.yaml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    permissions:
      pull-requests: write
      contents: read