```yaml
# This reusable workflow sets the milestone based on the
# current PR labels.

name: PR Milestone

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number

permissions:
  pull-requests: write
  contents: read

jobs:
  set-milestone:
    name: Set PR milestone
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set milestone
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const prNumber = ${{ inputs.pr_number }};

            /*
             * Read release targets.
             */
            const releaseTargetsFile = fs.readFileSync(
              '.github/release-targets.yaml',
              'utf8'
            );

            const getTarget = (name) => {
              const match = releaseTargetsFile.match(
                new RegExp(`^${name}:\\s*["']?([^"'\\s]+)["']?`, 'm')
              );

              if (!match) {
                core.setFailed(
                  `Release target "${name}" was not found.`
                );
                return null;
              }

              return match[1];
            };

            const major = getTarget('major');
            const minor = getTarget('minor');
            const bugFix = getTarget('bug_fix');

            if (!major || !minor || !bugFix) {
              return;
            }

            /*
             * Get current PR labels.
             */
            const { data: labels } =
              await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });

            const labelNames =
              labels.map(label => label.name);

            /*
             * Infrastructure PRs cannot be Breaking API.
             */
            const hasInfrastructure =
              labelNames.includes('Infrastructure');

            const hasBreakingApi =
              labelNames.includes('Breaking API');

            if (hasInfrastructure && hasBreakingApi) {
              core.setFailed(
                'Infrastructure PRs cannot be Breaking API changes.'
              );
              return;
            }

            /*
             * Determine the milestone.
             *
             * Breaking API has highest priority.
             */
            let targetMilestone;

            if (hasBreakingApi) {
              targetMilestone = major;
            } else if (labelNames.includes('Bug Fix')) {
              targetMilestone = bugFix;
            } else if (
              labelNames.includes('Feature') ||
              hasInfrastructure
            ) {
              targetMilestone = minor;
            } else {
              core.info(
                'No milestone-related labels found.'
              );
              return;
            }

            core.info(
              `Target milestone: ${targetMilestone}`
            );

            /*
             * Find the milestone.
             */
            const { data: milestones } =
              await github.rest.issues.listMilestones({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open'
              });

            const milestone = milestones.find(
              milestone => milestone.title === targetMilestone
            );

            if (!milestone) {
              core.setFailed(
                `Milestone "${targetMilestone}" was not found.`
              );
              return;
            }

            /*
             * Set the milestone.
             */
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              milestone: milestone.number
            });

            core.info(
              `Milestone set to "${targetMilestone}".`
            );
