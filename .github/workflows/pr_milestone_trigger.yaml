# This workflow is triggered when a PR label is added or removed.
# It calls the reusable PR milestone workflow.

name: PR Milestone Trigger

on:
  pull_request:
    types:
      - labeled
      - unlabeled

permissions:
  pull-requests: write
  contents: read

jobs:
  milestone:
    uses: ./.github/workflows/pr_milestone.yaml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    permissions:
      pull-requests: write
      contents: read