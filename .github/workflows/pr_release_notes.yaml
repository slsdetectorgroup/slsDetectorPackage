# This reusable workflow validates the PR release notes. It ignores comments and
# <details> blocks, checks for notes under the "## Release notes" section. If 
# it is not an Infrastructure PR and release notes are not found, it should find
# them in an equivalent PR or referenced PR, else validation fails. If it is an 
# Infrastructure PR or release notes are not found in an equivalent or 
# referenced PR, it should add label 'No Release Note'.

#test branch

name: PR Release Notes

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number

permissions:
  pull-requests: write
  contents: read
  issues: write
  copilot-requests: write

jobs:
  check-release-notes:
    name: Check PR release notes
    runs-on: ubuntu-latest

    steps:
      - name: Find release notes in current PR
        id: find-current
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = ${{ inputs.pr_number }};

            if (!prNumber) {
              core.setFailed('Unable to determine PR number.');
              return;
            }

            core.setOutput('needs_validation', 'true');
            core.setOutput('has_release_notes_current', 'false');

            const stripIgnoredContent = (text = '') => {
              return (text || '')
                .replace(/<!--.*?-->/gs, '\n')
                .replace(/<details\b[\s\S]*?<\/details>/gi, '\n')
                .trim();
            };

            const findReleaseNotesSection = (body = '') => {
              const sanitized = stripIgnoredContent(body || '');
              if (!sanitized) return '';

              const match = sanitized.match(
                /(^|\n)#{1,6}\s*Release notes\s*\n([\s\S]*?)(?=\n#{1,6}\s+\S|\s*$)/i
              );
              if (!match) return '';

              let section = (match[2] || '')
                .split('\n')
                .filter(line => !/^#{1,6}\s+/.test(line.trim()))
                .join('\n')
                .trim();

              return section;
            };

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const baseBranch = pr.base.ref;

            if (baseBranch === 'main') {
              core.info('PR targets main branch. Release notes validation is not required.');
              core.setOutput('needs_validation', 'false');
              return;
            }

            const releaseNotes = findReleaseNotesSection(pr.body || '');
            const hasReleaseNotesCurrent = Boolean(releaseNotes);
            core.setOutput('has_release_notes_current', hasReleaseNotesCurrent.toString());
            core.info('Release notes in current PR: ' + (hasReleaseNotesCurrent ? 'true' : 'false'));

      - name: Validate with labels
        id: validate-labels
        if: steps.find-current.outputs.needs_validation == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = ${{ inputs.pr_number }};
            const hasReleaseNotesCurrent = '${{ steps.find-current.outputs.has_release_notes_current }}' === 'true';

            core.setOutput('needs_linked_pr_search', 'false');
            core.setOutput('add_ai_release_notes', 'false');

            const { data: labels } =
              await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });
            const labelNames = labels.map(label => label.name);

            const hasInfrastructure = labelNames.includes('Infrastructure');
            core.info('Infrastructure label: ' + hasInfrastructure);

            const developingDetectorLabels = ['Ctb', 'Xilinx Ctb', 'Matterhorn'];
            const otherDetectorLabels = ['Eiger', 'Mythen3', 'Gotthard2', 'Jungfrau', 'Moench'];
            const hasDevelopingDetectorLabel = labelNames.some(
              label => developingDetectorLabels.includes(label)
            );
            const hasOtherDetectorLabel = labelNames.some(
              label => otherDetectorLabels.includes(label)
            );
            const hasOnlyDevelopingDetectors =
              hasDevelopingDetectorLabel && !hasOtherDetectorLabel;
            core.info('Only developing detector labels: ' + hasOnlyDevelopingDetectors);

            if (hasInfrastructure || hasOnlyDevelopingDetectors) {
              if (hasReleaseNotesCurrent) {
                core.setFailed(
                  'Infrastructure PRs or only developing Detector PRs cannot include release notes. Remove the release notes in the "## Release notes" section, change the PR type or remove developing detector labels.'
                );
                return;
              }
              core.info('No release notes found, which is valid for Infrastructure or only developing Detector PRs.');
              return;
            }

            if (hasReleaseNotesCurrent) {
              core.setOutput('add_ai_release_notes', 'true');
              core.info('Current PR has release notes; AI assisted notes will be added.');
              return;
            }

            core.setOutput('needs_linked_pr_search', 'true');

      - name: Find release notes in linked PRs
        if: >-
          ${{
            steps.find-current.outputs.needs_validation == 'true' &&
            steps.validate-labels.outputs.needs_linked_pr_search == 'true'
          }}
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = ${{ inputs.pr_number }};

            const stripIgnoredContent = (text = '') => {
              return (text || '')
                .replace(/<!--.*?-->/gs, '\n')
                .replace(/<details\b[\s\S]*?<\/details>/gi, '\n')
                .trim();
            };

            const findReleaseNotesSection = (body = '') => {
              const sanitized = stripIgnoredContent(body || '');
              if (!sanitized) return '';

              const match = sanitized.match(
                /(^|\n)#{1,6}\s*Release notes\s*\n([\s\S]*?)(?=\n#{1,6}\s+\S|\s*$)/i
              );
              if (!match) return '';

              return (match[2] || '')
                .split('\n')
                .filter(line => !/^#{1,6}\s+/.test(line.trim()))
                .join('\n')
                .trim();
            };

            const parseNumberList = (text) => {
              if (!text) {
                return [];
              }
              return Array.from(
                new Set(
                  Array.from(text.matchAll(/#(\d+)/g), match => Number(match[1]))
                )
              );
            };

            const findReferencedPrNumbers = (body = '') => {
              if (!body) {
                return [];
              }
              const relevantSections = [
                'Equivalent PRs',
                'Referenced PRs'
              ];
              const patterns = relevantSections.map(section =>
                new RegExp(
                  `(^|\\n)#{1,6}\\s*${section.replace(/[.*+?^${}()|[\\]\\]/g, '\\$&')}\\s*\\n([\\s\\S]*?)(?=\\n#{1,6}\\s+\\S|\\s*$)`,
                  'i'
                )
              );
              const numbers = [];
              for (const pattern of patterns) {
                const match = body.match(pattern);
                if (match && match[2]) {
                  numbers.push(...parseNumberList(match[2]));
                }
              }
              return Array.from(new Set(numbers));
            };

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const equivalentAndReferencedPrNumbers = findReferencedPrNumbers(pr.body || '');
            for (const referencedPrNumber of equivalentAndReferencedPrNumbers) {
              if (referencedPrNumber === prNumber) {
                continue;
              }
              try {
                const { data: referencedPr } =
                  await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: referencedPrNumber
                  });
                const referencedNotes = findReleaseNotesSection(referencedPr.body || '');
                if (referencedNotes) {
                  core.info(
                    `Release notes found: In equivalent/referenced PR #${referencedPrNumber}. ` +
                    `Using that as the source for this PR.`
                  );
                  return;
                }
              } catch (error) {
                core.warning(
                  `Unable to inspect referenced PR #${referencedPrNumber}: ${error.message}`
                );
              }
            }

            core.setFailed(
              'No release notes were found in the PR body, equivalent PRs, or referenced PRs.'
            );

      - name: Add AI assisted release notes
        if: >-
          ${{
            steps.find-current.outputs.needs_validation == 'true' &&
            steps.validate-labels.outputs.add_ai_release_notes == 'true'
          }}
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = ${{ inputs.pr_number }};

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const getFallbackAiAssistedNotes = (files = []) => {
              if (!files.length) {
                return '- No file-level changes were available to summarize.';
              }

              const changedFiles = files
                .slice(0, 25)
                .map(file => {
                  const type =
                    file.status === 'added'
                      ? 'Added'
                      : file.status === 'removed'
                      ? 'Removed'
                      : 'Updated';
                  return `- ${type} ${file.filename}`;
                })
                .join('\n');

              const remainder = files.length > 25
                ? `\n- Additional changed files not shown: ${files.length - 25}`
                : '';

              return `${changedFiles}${remainder}`;
            };

            const getAiAssistedReleaseNotes = async () => {
              const files = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  per_page: 100
                }
              );

              const compactDiff = files
                .slice(0, 15)
                .map(file => {
                  const patch = (file.patch || '')
                    .split('\n')
                    .slice(0, 40)
                    .join('\n');
                  return [
                    `File: ${file.filename}`,
                    `Status: ${file.status}`,
                    `Patch:`,
                    patch || '(patch unavailable)'
                  ].join('\n');
                })
                .join('\n\n---\n\n');

              const prompt = [
                'Generate concise release notes from this pull request diff.',
                'Use markdown bullet points.',
                'Focus on user-visible behavior, API changes, and detector-facing impact.',
                'Do not mention internal implementation details unless externally relevant.',
                '',
                `PR title: ${pr.title || ''}`,
                '',
                compactDiff
              ].join('\n');

              try {
                const { execFile } = require('child_process');
                const { promisify } = require('util');
                const execFileAsync = promisify(execFile);

                const { stdout } = await execFileAsync(
                  'copilot',
                  [
                    '-p',
                    prompt,
                    '-s',
                    '--no-ask-user',
                    '--model',
                    'gpt-4.1-mini'
                  ],
                  {
                    env: {
                      ...process.env,
                      GITHUB_TOKEN: process.env.GITHUB_TOKEN
                    },
                    maxBuffer: 1024 * 1024
                  }
                );

                const aiText = stdout.trim();

                if (!aiText) {
                  throw new Error('AI response did not contain message content.');
                }

                return aiText;
              } catch (error) {
                core.warning(
                  `AI release notes generation failed, using fallback summary: ${error.message}`
                );
                return getFallbackAiAssistedNotes(files);
              }
            };

            const upsertAiAssistedReleaseNotes = (body = '', aiNotes = '') => {
              const releaseNotesSectionPattern =
                /(^|\n)(##\s*Release notes\s*\n)([\s\S]*?)(?=\n##\s+\S|\s*$)/i;
              const aiSubsectionPattern =
                /(^|\n)###\s*AI Assisted Release Notes\s*\n([\s\S]*?)(?=\n###\s+\S|\n##\s+\S|\s*$)/gi;

              return body.replace(
                releaseNotesSectionPattern,
                (fullMatch, prefix, heading, sectionBody) => {
                  const cleanedSectionBody = (sectionBody || '')
                    .replace(aiSubsectionPattern, '\n')
                    .trimEnd();

                  const aiSubsection =
                    '### AI Assisted Release Notes\n\n' +
                    `${aiNotes.trim() || '- No AI-assisted notes were generated.'}\n`;

                  const updatedSectionBody =
                    (cleanedSectionBody ? `${cleanedSectionBody}\n\n` : '') +
                    aiSubsection;

                  return `${prefix}${heading}${updatedSectionBody}`;
                }
              );
            };

            const aiAssistedNotes = await getAiAssistedReleaseNotes();
            const newBody = upsertAiAssistedReleaseNotes(pr.body || '', aiAssistedNotes);

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: newBody
            });

            core.info('AI Assisted Release Notes subsection updated in PR body.');
