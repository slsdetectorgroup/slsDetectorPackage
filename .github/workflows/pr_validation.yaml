# This workflow is triggered when editing the Pr description. It validates the PR type and Breaking API, then sets the labels.
name: PR Validation

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  pull-requests: write
  contents: read

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR type and Breaking API
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const prNumber = context.payload.pull_request.number;

            /*
             * Check which primary PR type is selected.
             */
            const feature =
              /-\s*\[[xX]\]\s*Feature\b/.test(body);

            const bugFix =
              /-\s*\[[xX]\]\s*Bug Fix\b/.test(body);

            const infrastructure =
              /-\s*\[[xX]\]\s*Infrastructure\b/.test(body);

            const primaryTypes = [
              feature && 'Feature',
              bugFix && 'Bug Fix',
              infrastructure && 'Infrastructure'
            ].filter(Boolean);

            /*
             * Exactly one primary PR type must be selected.
             */
            if (primaryTypes.length === 0) {
              core.setFailed(
                'No primary PR type selected. Select exactly one of: Feature, Bug Fix, Infrastructure.'
              );
              return;
            }

            if (primaryTypes.length > 1) {
              core.setFailed(
                `Multiple primary PR types selected: ${primaryTypes.join(', ')}. Select exactly one.`
              );
              return;
            }

            const primaryType = primaryTypes[0];

            /*
             * Infrastructure PRs cannot be Breaking API.
             */
            const breakingApi =
              /-\s*\[[xX]\]\s*This is a Breaking API change\b/.test(body);

            if (infrastructure && breakingApi) {
              core.setFailed(
                'Infrastructure PRs cannot be Breaking API changes.'
              );
              return;
            }

            core.info(`Primary PR type: ${primaryType}`);
            core.info(
              `Breaking API: ${breakingApi ? 'yes' : 'no'}`
            );

            /*
             * Primary PR type labels.
             */
            const primaryLabels = [
              'Feature',
              'Bug Fix',
              'Infrastructure'
            ];

            /*
             * Get the labels currently on the PR.
             */
            const { data: currentLabels } =
              await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });

            const currentLabelNames =
              currentLabels.map(label => label.name);

            /*
             * Remove any incorrect primary PR type labels.
             */
            for (const label of primaryLabels) {
              if (
                label !== primaryType &&
                currentLabelNames.includes(label)
              ) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: label
                });

                core.info(`Removed label: ${label}`);
              }
            }

            /*
             * Add the correct primary PR type label.
             */
            if (!currentLabelNames.includes(primaryType)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [primaryType]
              });

              core.info(`Added label: ${primaryType}`);
            }

            // Synchronize Breaking API label
            if (breakingApi && !currentLabelNames.includes('Breaking API')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['Breaking API']
              });

              core.info('Added label: Breaking API');
            }

            if (!breakingApi && currentLabelNames.includes('Breaking API')) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: 'Breaking API'
              });

              core.info('Removed label: Breaking API');
            }

            core.info('PR validation passed.');