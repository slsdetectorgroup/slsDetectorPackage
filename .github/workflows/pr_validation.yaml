# This workflow is triggered when editing the Pr description. It validates the PR type and Breaking API, then sets the labels. It also calls the PR milestone workflow to set the milestone based on the PR type label.
name: PR Validation

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited

permissions:
  pull-requests: write
  contents: read

jobs:
  validate-pr:
    name: Validate PR
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR type and Breaking API
        uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const prNumber = context.payload.pull_request.number;

            /*
             * Check which primary PR type is selected.
             */
            const feature =
              /-\s*\[[xX]\]\s*Feature\b/.test(body);

            const bugFix =
              /-\s*\[[xX]\]\s*Bug Fix\b/.test(body);

            const infrastructure =
              /-\s*\[[xX]\]\s*Infrastructure\b/.test(body);

            const primaryTypes = [
              feature && 'Feature',
              bugFix && 'Bug Fix',
              infrastructure && 'Infrastructure'
            ].filter(Boolean);

            /*
             * Exactly one primary PR type must be selected.
             */
            if (primaryTypes.length !== 1) {
              core.setFailed(
                'Exactly one primary PR type must be selected. Select exactly one of: Feature, Bug Fix, Infrastructure.'
              );
              return;
            }

            const primaryType = primaryTypes[0];

            /*
             * Infrastructure PRs cannot be Breaking API.
             */
            const breakingApi =
              /-\s*\[[xX]\]\s*This is a Breaking API change\b/.test(body);

            if (infrastructure && breakingApi) {
              core.setFailed(
                'Infrastructure PRs cannot be Breaking API changes.'
              );
              return;
            }

            core.info(`Primary PR type: ${primaryType}`);
            core.info(
              `Breaking API: ${breakingApi ? 'yes' : 'no'}`
            );

            /*
             * Get the labels currently on the PR.
             */
            const { data: currentLabels } =
              await github.rest.issues.listLabelsOnIssue({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });

            const currentLabelNames =
              currentLabels.map(label => label.name);

            const primaryLabels = [
              'Feature',
              'Bug Fix',
              'Infrastructure'
            ];

            const selectedPrimary =
              primaryLabels.filter(label =>
                currentLabelNames.includes(label)
              );

            if (selectedPrimary.length > 1) {
              core.setFailed(
                `Invalid PR label state: multiple primary labels are present: ${selectedPrimary.join(', ')}.`
              );
              return;
            }

            if (selectedPrimary.length === 1 && selectedPrimary[0] !== primaryType) {
              core.setFailed(
                `Invalid PR label state: the PR body selects ${primaryType}, but the existing label is ${selectedPrimary[0]}.`
              );
              return;
            }

            if (
              currentLabelNames.includes('Breaking API') &&
              infrastructure
            ) {
              core.setFailed(
                'Infrastructure PRs cannot have the Breaking API label.'
              );
              return;
            }

            if (
              !breakingApi &&
              currentLabelNames.includes('Breaking API')
            ) {
              core.setFailed(
                'Breaking API label is present but the PR body does not mark the checkbox.'
              );
              return;
            }

            if (
              breakingApi &&
              !currentLabelNames.includes('Breaking API')
            ) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['Breaking API']
              });

              core.info('Added label: Breaking API');
            }

            if (!currentLabelNames.includes(primaryType)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: [primaryType]
              });

              core.info(`Added label: ${primaryType}`);
            }

            core.info('PR validation passed.');

  milestone:
    needs: validate-pr
    uses: ./.github/workflows/pr_milestone.yaml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    permissions:
      pull-requests: write
      contents: read