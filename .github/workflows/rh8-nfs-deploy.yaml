name: Build and Deploy on local RHEL8

on:
  push:
    #branches:
     # - developer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: "detectors-software-RH8"
    steps:
      - uses: actions/checkout@v4

      - name: Build library 
        run: |
            source /home/github_runner/.bashrc
            conda activate det
            mkdir build && cd build
            conda activate det
            cmake .. -DSLS_USE_PYTHON=ON -DSLS_USE_SIMULATOR=ON -DSLS_USE_GUI=ON
            make -j 2 

      - name: Deploy to NFS update server
        if: github.ref == 'refs/heads/developer'
        run: |
            cp -r build/bin /home/github_runner/slsDetectorSoftware/RH8
            cp slsDetectorServers/ctbDetectorServer/bin/ctbDetectorServer_developer /home/github_runner/slsDetectorSoftware/RH8
            cp -r pyctbgui /home/github_runner/slsDetectorSoftware/RH8