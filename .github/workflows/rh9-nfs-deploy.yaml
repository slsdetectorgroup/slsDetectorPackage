name: Build and Deploy on local RHEL9

on:
  push:
    #branches:
      #- developer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: "detectors-software-RH9"
    steps:
      - uses: actions/checkout@v4

      - name: Build library 
        run: |
            mkdir build && cd build
            cmake .. -DSLS_USE_PYTHON=ON -DSLS_USE_SIMULATOR=ON -DSLS_USE_GUI=ON
            make -j 2 

      - name: Deploy to NFS update server
        if: github.ref == 'refs/heads/developer'
        run: |
            sftp -r gitea_runner@mpc2935:/slsDetectorSoftware/RH9 <<< $'put build/bin'
            sftp -r gitea_runner@mpc2935:/slsDetectorSoftware/RH9 <<< $'put pyctbgui'
            sftp -r gitea_runner@mpc2935:/slsDetectorSoftware/RH9 <<< $'put slsDetectorServers/ctbDetectorServer/bin/ctbDetectorServer_developer'