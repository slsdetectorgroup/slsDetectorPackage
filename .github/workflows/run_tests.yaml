name: Run Unit Tests

on:
  push:



env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug  

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: 'pip'
      - run: pip install pytest numpy colorama

      # using a stable action version instead of latest to create/restore cache for now
      - uses: awalsh128/cache-apt-pkgs-action@v1.6.1
        with:
          packages: libhdf5-dev 
          version: 1.0

      - name: Configure CMake
        run: |
          cmake -B ${{github.workspace}}/build \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DSLS_USE_TESTS=ON \
          -DSLS_USE_SIMULATOR=ON \
          -DSLS_USE_PYTHON=ON \
          -DSLS_USE_HDF5=ON

      - name: Build
          # Build your program with the given configuration
        run: cmake --build ${{github.workspace}}/build -j4 --config ${{env.BUILD_TYPE}}

      # TODO: temporary, remove once the zmq segfault on ubuntu-latest is understood
      - name: Debug zmq segfault (temporary)
        if: always()
        working-directory: ${{github.workspace}}/build
        run: |
          sudo apt-get install -y gdb > /dev/null
          lsb_release -a; uname -r; c++ --version | head -1; ldd --version | head -1
          grep -iE "sodium|curve|poller|ZMQ_HAVE|IPV6" _deps/libzmq-build/platform.hpp || true
          gdb -batch -ex run -ex "thread apply all bt" --args bin/tests "Get port number for sub"
          gdb -batch -ex run -ex "thread apply all bt" --args bin/tests "Get port number for pub"
        
      - name: Python unit tests
        working-directory: ${{github.workspace}}/build/bin
        run: |
          python -m pytest ${{github.workspace}}/python/tests
          # high_memory tests only run on the self hosted runners (rh8/rh9-local-tests.yaml)
          python -m pytest -m "detectorintegration and not high_memory" ${{github.workspace}}/python/tests --detector-integration

      - name: C++ unit tests
        working-directory: ${{github.workspace}}/build
        run: ctest -C ${{env.BUILD_TYPE}} -j1 --rerun-failed --output-on-failure


      - name: Simulator unit tests
        working-directory: ${{github.workspace}}/build/bin
        run: |
          python test_simulators.py --no-log-file --quiet --tests "[detectorintegration]~[disable_check_data_file]"
          #remove --quiet to see more prints from simulator, receiver and tests
          python test_frame_synchronizer.py