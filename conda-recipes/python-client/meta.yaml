source:
  path: ../..

{% set version = load_file_regex(load_file = 'VERSION', regex_pattern = '(\d+(?:\.\d+)*(?:[\+\w\.]+))').group(1) %}
package:
  name: slsdet
  version: {{ version }} 

build:
  number: 0
  script:
    # gcc_linux-64 16.2.0 build 3 passes bare tool names in CMAKE_ARGS
    # (-DCMAKE_AR=x86_64-conda-linux-gnu-ar), which CMake resolves relative to
    # SRC_DIR. Restore the full paths; no-op when they are already absolute.
    - 'export CMAKE_ARGS="${CMAKE_ARGS//=${HOST}-/=${BUILD_PREFIX}/bin/${HOST}-}"' # [not win]
    - unset CMAKE_GENERATOR && {{ PYTHON }} -m pip install . -vv --config-settings=cmake.define.SLS_USE_SYSTEM_ZMQ=ON # [not win]

requirements:
  build:
    - python 
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}

  host:
    - cmake
    - ninja
    - python 
    - pip
    - scikit-build-core
    - pybind11 >=2.13.0
    - fmt
    - zeromq
    - nlohmann_json
    - catch2

  run:
    - python 
    - numpy


test:
  imports:
    - slsdet


about:
  summary: An example project built with pybind11 and scikit-build.
  # license_file: LICENSE