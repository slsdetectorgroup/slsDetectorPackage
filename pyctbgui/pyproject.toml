[build-system]
requires = ["setuptools", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "pyctbgui"
description = "Experimental GUI for the chip test board"
version = "0.0.0" 
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyzmq",
    "pillow",
    "PyQt5",
    "pyqtgraph",
    "matplotlib",
    "aare",
    "slsdet",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "ruff==0.0.285",
    "yapf==0.40.1",
    "pytest-ruff==0.1.1",
    "pre-commit",
    "pytest-qt",
]

[tool.setuptools]
package-dir = {"" = "pyctbgui"}

[tool.setuptools.packages.find]
where = ["pyctbgui"]

[project.scripts]
CtbGui = "pyctbgui.main:main"

[tool.ruff]
line-length = 119
select = ["E","F","UP","PT","RET","SLF","TID","PTH","NPY"]
# other usefule rules "N" "PL"
# rules to ignore
# PTH123 causes issues with gh actions
ignore = ["UP032","PTH123"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

target-version = "py311"

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"] # ignore unused import warnings

[tool.yapf]
based_on_style = "pep8"
COLUMN_LIMIT = 119

[tool.coverage.run]
branch = false

[tool.coverage.report]
include = [
    "pyctbgui/*"
]

